{% extends "base.html" %}
{% block title %}Log in · Docker Track{% endblock %}
{% block content %}
<section class="narrow">
  <p class="kicker">Container monitor</p>
  <h1>Log in</h1>
  <p class="hint">Status, logs, and a model hypothesis for the containers assigned to you.</p>
  {% if form.errors %}
    <p class="error">That username and password did not match.</p>
  {% endif %}
  <form method="post" action="{{ url('login') }}" class="stack">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autofocus required autocomplete="username">
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" required autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
