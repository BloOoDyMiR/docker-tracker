services:
  agent:
    build: ./agent
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN}
      PROJECTS_ROOT: /projects
      HOST_PROJECTS_DIR: ${PROJECTS_DIR:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_DIR:-./projects}:/projects
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  web:
    build: ./web
    env_file: .env
    environment:
      AGENT_URL: http://agent:8001
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - django-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - agent
    restart: unless-stopped

  demo:
    image: nginx:alpine
    labels:
      track.project: demo
    restart: unless-stopped

volumes:
  django-data:
